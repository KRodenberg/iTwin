name: Publish F-Block iTwin Docker Image

on:
  push:
    branches:
      - main
      - testing
    paths:
      - "F-Block iTwin/**"
      - ".github/workflows/f-block-itwin-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/krodenberg/f-block-itwin

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=testing,enable=${{ github.ref_name == 'testing' }}
            type=ref,event=branch
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/KRodenberg/iTwin
            org.opencontainers.image.description=F-Block iTwin production image

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./F-Block iTwin
          file: ./F-Block iTwin/Dockerfile
          push: true
          build-args: |
            IMJS_AUTH_CLIENT_CLIENT_ID=${{ secrets.IMJS_AUTH_CLIENT_CLIENT_ID || vars.IMJS_AUTH_CLIENT_CLIENT_ID }}
            IMJS_AUTH_CLIENT_REDIRECT_URI=${{ secrets.IMJS_AUTH_CLIENT_REDIRECT_URI || vars.IMJS_AUTH_CLIENT_REDIRECT_URI }}
            IMJS_AUTH_CLIENT_LOGOUT_URI=${{ secrets.IMJS_AUTH_CLIENT_LOGOUT_URI || vars.IMJS_AUTH_CLIENT_LOGOUT_URI }}
            IMJS_AUTH_CLIENT_SCOPES=${{ secrets.IMJS_AUTH_CLIENT_SCOPES || vars.IMJS_AUTH_CLIENT_SCOPES }}
            IMJS_AUTH_AUTHORITY=${{ secrets.IMJS_AUTH_AUTHORITY || vars.IMJS_AUTH_AUTHORITY }}
            IMJS_ITWIN_ID=${{ secrets.IMJS_ITWIN_ID || vars.IMJS_ITWIN_ID }}
            IMJS_IMODEL_ID=${{ secrets.IMJS_IMODEL_ID || vars.IMJS_IMODEL_ID }}
            IMJS_BING_MAPS_KEY=${{ secrets.IMJS_BING_MAPS_KEY || vars.IMJS_BING_MAPS_KEY }}
            IMJS_MAP_BOX_KEY=${{ secrets.IMJS_MAP_BOX_KEY || vars.IMJS_MAP_BOX_KEY }}
            IMJS_CESIUM_ION_KEY=${{ secrets.IMJS_CESIUM_ION_KEY || vars.IMJS_CESIUM_ION_KEY }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
