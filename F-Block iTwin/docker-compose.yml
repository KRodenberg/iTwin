services:
  itwin-app:
    build:
      context: .
      args:
        IMJS_AUTH_CLIENT_CLIENT_ID: ${IMJS_AUTH_CLIENT_CLIENT_ID:-}
        IMJS_AUTH_CLIENT_REDIRECT_URI: ${IMJS_AUTH_CLIENT_REDIRECT_URI:-}
        IMJS_AUTH_CLIENT_LOGOUT_URI: ${IMJS_AUTH_CLIENT_LOGOUT_URI:-}
        IMJS_AUTH_CLIENT_SCOPES: ${IMJS_AUTH_CLIENT_SCOPES:-itwin-platform}
        IMJS_AUTH_AUTHORITY: ${IMJS_AUTH_AUTHORITY:-https://ims.bentley.com}
        IMJS_ITWIN_ID: ${IMJS_ITWIN_ID:-}
        IMJS_IMODEL_ID: ${IMJS_IMODEL_ID:-}
        IMJS_BING_MAPS_KEY: ${IMJS_BING_MAPS_KEY:-}
        IMJS_MAP_BOX_KEY: ${IMJS_MAP_BOX_KEY:-}
        IMJS_CESIUM_ION_KEY: ${IMJS_CESIUM_ION_KEY:-}
    image: f-block-itwin:latest
    ports:
      - "3000:80"
    environment:
      IMJS_AUTH_CLIENT_CLIENT_ID: ${IMJS_AUTH_CLIENT_CLIENT_ID:-}
      IMJS_AUTH_CLIENT_REDIRECT_URI: ${IMJS_AUTH_CLIENT_REDIRECT_URI:-}
      IMJS_AUTH_CLIENT_LOGOUT_URI: ${IMJS_AUTH_CLIENT_LOGOUT_URI:-}
      IMJS_AUTH_CLIENT_SCOPES: ${IMJS_AUTH_CLIENT_SCOPES:-itwin-platform}
      IMJS_AUTH_AUTHORITY: ${IMJS_AUTH_AUTHORITY:-https://ims.bentley.com}
      IMJS_ITWIN_ID: ${IMJS_ITWIN_ID:-}
      IMJS_IMODEL_ID: ${IMJS_IMODEL_ID:-}
      IMJS_BING_MAPS_KEY: ${IMJS_BING_MAPS_KEY:-}
      IMJS_MAP_BOX_KEY: ${IMJS_MAP_BOX_KEY:-}
      IMJS_CESIUM_ION_KEY: ${IMJS_CESIUM_ION_KEY:-}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARED_TOKEN:?Set CLOUDFLARED_TOKEN before starting compose}"
    depends_on:
      - itwin-app
    restart: unless-stopped
